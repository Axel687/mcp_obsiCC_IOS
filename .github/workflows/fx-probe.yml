name: fx-probe
on:
  push:
    branches: [claude/fx-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "2/profile/jack" "2/profile/jack/statuses" "2/profile/jack/statuses?count=5" "2/profile/jack/media" "2/profile/jack/statuses?with_replies=1" "2/profile/id:12/statuses" "2/status/20" "jack"; do
            echo "== $p"; curl -s -A "obsidian-mcp (+https://github.com/Axel687/mcp_obsiCC_IOS)" -w " [HTTP %{http_code}]\n" "https://api.fxtwitter.com/$p" | head -c 600; echo
          done
