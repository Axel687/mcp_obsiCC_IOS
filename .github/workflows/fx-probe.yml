name: fx-probe
on:
  push:
    branches: [claude/fx-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -e .
      - run: |
          python - <<'PY'
          from obsidian_mcp import server
          for kw in [dict(account="jack", count=5), dict(account="NASA", count=5), dict(account="id:12", count=3),
                     dict(account="jack", since="7d", count=5), dict(account="jack", only_reposts=True, count=3)]:
              out = server.read_x_inbox(**kw)
              print("==", kw, "ok", out.get("ok"), out.get("error"), "count", out.get("count"), "next", (out.get("next_cursor") or "")[:12])
              for p in out.get("posts", []):
                  print("  ", p["kind"], "@" + p["username"], p["date"], repr(p["text"][:40]))
              if out.get("next_cursor"):
                  o2 = server.read_x_inbox(account=kw["account"], cursor=out["next_cursor"], count=2)
                  print("   page2 ok", o2.get("ok"), o2.get("error"), [p["id"] for p in o2.get("posts", [])])
          PY
