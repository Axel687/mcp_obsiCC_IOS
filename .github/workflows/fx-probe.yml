name: fx-probe
on:
  push:
    branches: [claude/fx-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "2/profile/jack/statuses?with_replies=1&count=10" "2/profile/id:12/statuses?count=10" "2/profile/NASA/statuses?count=5" "2/profile/NASA/statuses?with_replies=1&count=5" "2/profile/id:11348282/statuses?count=5" "2/profile/jack/statuses?with_replies=1&count=5&since=1793600000"; do
            echo "== $p"; curl -s -A "obsidian-mcp (+https://github.com/Axel687/mcp_obsiCC_IOS)" -o /tmp/r.json -w "[HTTP %{http_code}]\n" "https://api.fxtwitter.com/$p"
            python3 -c "
          import json
          try: d=json.load(open('/tmp/r.json'))
          except Exception as e: print('no json', e); raise SystemExit
          print('keys', list(d), 'cursor', d.get('cursor'))
          for s in d.get('results',[]):
              print(' ', s.get('type'), 'by', (s.get('reposted_by') or {}).get('screen_name'), '@'+(s.get('author') or {}).get('screen_name',''), 'reply_to', s.get('replying_to'), repr((s.get('text') or '')[:50]))
          "
          done
