# Run on the VPS:  cp .env.example .env  (fill it in)  then  docker compose up -d --build
services:
  obsidian-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OBSIDIAN_MCP_PUBLIC_URL: https://${MCP_DOMAIN}
    volumes:
      - vault:/data/vault
      - state:/data/state
    # Not published on the host: only Caddy can reach it.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - obsidian-mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  vault:
  state:
  caddy_data:
  caddy_config:
